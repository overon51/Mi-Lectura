<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lector</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #bb86fc; }
        h2 { border-bottom: 2px solid #bb86fc; padding-bottom: 5px; margin-top: 30px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-info { display: flex; flex-direction: column; }
        .card-title { font-weight: bold; font-size: 1.1em; }
        .card-progress { font-size: 0.9em; color: #a0a0a0; margin-top: 5px; }
        .btn { background-color: #bb86fc; color: #000; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; }
        .btn-app { background-color: #03dac6; }
    </style>
</head>
<body>

    <h1>Mi Panel de Lectura</h1>

    <h2>Novelas Ligeras</h2>
    
    <div class="card">
        <div class="card-info">
            <span class="card-title">Nombre de tu Novela 1</span>
            <span class="card-progress">Capítulo actual: 45</span>
        </div>
        <!-- Cambia el enlace "href" por la URL del capítulo que toque -->
        <a href="https://tusitio.com/novela1/capitulo-45" class="btn" target="_blank">Leer</a>
    </div>

    <h2>Apps de Manga</h2>

    <div class="card">
        <div class="card-info">
            <span class="card-title">Manga Dogs</span>
        </div>
        <!-- Este enlace abrirá la app si está instalada -->
        <a href="intent://#Intent;package=com.mangadogs.app;end" class="btn btn-app">Abrir App</a>
    </div>

    <div class="card">
        <div class="card-info">
            <span class="card-title">Imperio Manhwa</span>
        </div>
        <a href="intent://#Intent;package=com.hispamanga.app;end" class="btn btn-app">Abrir App</a>
    </div>

</body>
</html>
